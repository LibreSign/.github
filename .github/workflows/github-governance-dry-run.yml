name: GitHub governance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply governance changes
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - governance.config.json
      - .github/workflows/github-governance-dry-run.yml
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: github-governance-${{ inputs.apply && 'apply' || 'plan' }}
  cancel-in-progress: ${{ !inputs.apply }}

jobs:
  governance:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }} LibreSign governance
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The App private key is environment-scoped. One approval per run,
    # rather than one approval for every repository in a matrix.
    environment: ruleset-sync

    steps:
      - name: Checkout caller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          owner: LibreSign # zizmor: ignore[github-app] organization-wide governance requires organization repository access
          # Planning only needs read. Applying remains manual and requires environment approval.
          permission-administration: ${{ inputs.apply && 'write' || 'read' }}

      - name: ${{ inputs.apply && 'Apply' || 'Plan' }} repository governance
        uses: LibreCodeCoop/github-governance@d9ec0fef2d447508e88f23c0830461cedd1f9977 # PR #36; pin released version after upstream merge
        with:
          token: ${{ steps.app-token.outputs.token }}
          organization: LibreSign
          config: ${{ github.workspace }}/governance.config.json
          apply: ${{ inputs.apply && 'true' || 'false' }}
          allow-drift: 'true'
