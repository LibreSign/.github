name: GitHub governance dry run

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - governance.config.json
      - .github/workflows/github-governance-dry-run.yml

permissions:
  contents: read

concurrency:
  group: github-governance-dry-run
  cancel-in-progress: false

jobs:
  discover:
    name: Discover public repositories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repositories: ${{ steps.repositories.outputs.repositories }}

    steps:
      - name: List repositories
        id: repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repositories="$(
            gh api \
              --paginate \
              "orgs/LibreSign/repos?type=public&per_page=100" \
              --jq '.[] | select(.archived == false) | .name' |
              jq -Rsc 'split("\n") | map(select(length > 0))'
          )"
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan LibreSign/${{ matrix.repository }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ruleset-sync

    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}

    steps:
      - name: Checkout caller configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          owner: LibreSign
          repositories: ${{ matrix.repository }}
          permission-administration: write

      - name: Plan repository governance
        uses: LibreCodeCoop/github-governance@7e9079cbd80761460b2dfe4e4ebf887a6d283ee6
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: LibreSign/${{ matrix.repository }}
          config: ${{ github.workspace }}/governance.config.json
